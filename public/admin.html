<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — QA Shop</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>

<main class="page">
  <div class="container" id="admin-root">
    <span class="eyebrow">Admin</span>
    <h1>Admin panel</h1>

    <div class="tabs" data-testid="admin-tabs">
      <button class="tab-btn active" data-testid="admin-tab-products" onclick="switchTab('products')">Products</button>
      <button class="tab-btn" data-testid="admin-tab-orders" onclick="switchTab('orders')">Orders</button>
      <button class="tab-btn" data-testid="admin-tab-users" onclick="switchTab('users')">Users</button>
    </div>

    <div id="admin-content"></div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/admin.js"></script>
</body>
</html>
