<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — QA Shop</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>

<main class="page">
  <div class="container">
    <div class="card form-shell">
      <span class="eyebrow">Account</span>
      <h1>Log in</h1>
      <p class="subtitle">Demo accounts: <code>testuser / Test1234</code> (customer), <code>admin / Admin123</code> (admin).</p>

      <div id="login-banner"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" data-testid="login-username-input" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" data-testid="login-password-input" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit" data-testid="login-submit-btn">Log in</button>
      </form>

      <p class="subtitle" style="margin-top:18px">Don't have an account? <a href="register.html" data-testid="go-to-register-link">Create one</a></p>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
