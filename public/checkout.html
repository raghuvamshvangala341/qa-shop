<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — QA Shop</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-header"></div>

<main class="page">
  <div class="container">
    <span class="eyebrow">Checkout</span>
    <h1>Checkout</h1>

    <div class="steps" data-testid="checkout-steps">
      <div class="step done">1. Cart</div>
      <div class="step active">2. Shipping &amp; payment</div>
      <div class="step">3. Confirmation</div>
    </div>

    <div id="checkout-banner"></div>

    <div class="grid-2" style="align-items:flex-start">
      <div class="card" style="padding:24px">
        <form id="checkout-form" novalidate>
          <h3>Shipping address</h3>
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" data-testid="shipping-fullname-input" />
          </div>
          <div class="field">
            <label for="addressLine">Address</label>
            <input type="text" id="addressLine" name="addressLine" data-testid="shipping-address-input" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="city">City</label>
              <input type="text" id="city" name="city" data-testid="shipping-city-input" />
            </div>
            <div class="field">
              <label for="state">State</label>
              <input type="text" id="state" name="state" data-testid="shipping-state-input" />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="zip">ZIP code</label>
              <input type="text" id="zip" name="zip" data-testid="shipping-zip-input" />
            </div>
            <div class="field">
              <label for="country">Country</label>
              <input type="text" id="country" name="country" value="United States" data-testid="shipping-country-input" />
            </div>
          </div>

          <h3 style="margin-top:24px">Payment</h3>
          <div class="field">
            <label for="nameOnCard">Name on card</label>
            <input type="text" id="nameOnCard" name="nameOnCard" data-testid="payment-name-input" />
          </div>
          <div class="field">
            <label for="cardNumber">Card number</label>
            <input type="text" id="cardNumber" name="cardNumber" placeholder="16 digits, e.g. 4111111111111111" data-testid="payment-card-input" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="expiry">Expiry (MM/YY)</label>
              <input type="text" id="expiry" name="expiry" placeholder="12/29" data-testid="payment-expiry-input" />
            </div>
            <div class="field">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" name="cvv" placeholder="123" data-testid="payment-cvv-input" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn" data-testid="place-order-btn" style="margin-top:8px">Place order</button>
        </form>
      </div>

      <div class="card" style="padding:20px" id="checkout-summary" data-testid="checkout-summary">
        <div class="spinner-text">Loading order summary…</div>
      </div>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/pages/checkout.js"></script>
</body>
</html>
